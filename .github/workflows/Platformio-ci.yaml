name: PlatformIO CI

on: [push]

permissions:
  contents: write

jobs:
  build:
    name: Build Skyduino firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-${{ hashfiles('platformio.ini') }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install Platformio Libraries
        run: pio pkg install

      - id: build_skyduino
        uses: .github/actions/build-firmware
        with:
            pio_env: skyduino-dfu
            firmware_name: Firmware

      - id: build_skyduino_stepper
        uses: .github/actions/build-firmware
        with:
            pio_env: skyduino-stepper
            firmware_name: Firmware Stepper

  UploadAssets:
    name: Upload Assets
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
    uses: ./.github/workflows/upload-release-assets.yaml